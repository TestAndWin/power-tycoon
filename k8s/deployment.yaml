apiVersion: apps/v1
kind: Deployment
metadata:
  name: power-tycoon
  namespace: power-tycoon
  labels:
    app.kubernetes.io/name: power-tycoon
spec:
  replicas: 1
  # SQLite must never have two writers: stop the old pod before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: power-tycoon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: power-tycoon
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: power-tycoon
          image: power-tycoon:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: power-tycoon-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '1000m'
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            # created and chowned to 1001 by deploy.sh
            path: /srv/power-tycoon/data
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
